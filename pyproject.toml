[project]
name = "awara"
version = "0.0.0"
description = "Portable creative workflow recipe schema and validator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Suhail Suhail"}]
dependencies = ["jsonschema>=4.23,<5"]
[project.urls]
Repository = "https://github.com/orbyts/awara"
[project.scripts]
awara = "awara:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/awara", "README.md", "LICENSE", "pyproject.toml"]
